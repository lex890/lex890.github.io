      <rect width="268" height="232" rx="14" fill="#EEF0F4"/>
      <path d="M24 176L72 150L116 160L160 104L204 118L244 56V204H24Z" fill="url(#area)"/>
      <path d="M24 176L72 150L116 160L160 104L204 118L244 56" fill="none" stroke="#7B2FF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
