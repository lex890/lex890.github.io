<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Illustration of a resort scene next to a booking calendar">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E1E4EA" stroke-width="2"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A4CCF0"/>
      <stop offset="1" stop-color="#E59AEF"/>
    </linearGradient>
    <clipPath id="scene">
      <rect width="560" height="420" rx="20"/>
    </clipPath>
  </defs>
  <rect width="1280" height="720" fill="#F2F3F7"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Resort scene / 3D tour viewport -->
  <g transform="translate(112 150)">
    <rect x="10" y="12" width="560" height="420" rx="22" fill="#111214"/>
    <g clip-path="url(#scene)">
      <rect width="560" height="420" fill="url(#sky)"/>
      <circle cx="400" cy="150" r="64" fill="#FFC21A"/>
      <!-- Sea -->
      <path d="M0 250H560V420H0Z" fill="#5EC0C3"/>
      <path d="M0 274c35 0 35-12 70-12s35 12 70 12 35-12 70-12 35 12 70 12 35-12 70-12 35 12 70 12 35-12 70-12 35 12 70 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".7"/>
      <path d="M0 318c35 0 35-12 70-12s35 12 70 12 35-12 70-12 35 12 70 12 35-12 70-12 35 12 70 12 35-12 70-12 35 12 70 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".45"/>
      <!-- Sand -->
      <path d="M0 340C140 310 300 316 560 360V420H0Z" fill="#FFE29A"/>
      <!-- Palm -->
      <g stroke="#111214" stroke-width="5" stroke-linejoin="round">
        <path d="M118 360C112 290 122 220 150 160" fill="none" stroke-width="14" stroke-linecap="round"/>
        <path d="M150 160C120 130 80 128 46 146C84 146 112 156 150 160Z" fill="#5CFF4A"/>
        <path d="M150 160C160 120 196 98 240 100C206 116 180 136 150 160Z" fill="#5CFF4A"/>
        <path d="M150 160C190 150 228 170 248 204C214 186 184 174 150 160Z" fill="#5CFF4A"/>
        <path d="M150 160C126 176 108 206 106 240C122 208 136 186 150 160Z" fill="#5CFF4A"/>
      </g>
      <!-- Cabana -->
      <g transform="translate(330 262)" stroke="#111214" stroke-width="5" stroke-linejoin="round">
        <path d="M0 52L70 0L140 52Z" fill="#E6338A"/>
        <rect x="16" y="52" width="108" height="64" fill="#FFFFFF"/>
        <rect x="56" y="74" width="28" height="42" fill="#FFC21A"/>
      </g>
    </g>
    <rect width="560" height="420" rx="20" fill="none" stroke="#111214" stroke-width="5"/>
    <!-- 3D tour badge -->
    <g transform="translate(24 24)">
      <rect width="72" height="72" rx="16" fill="#111214"/>
      <g fill="none" stroke="#5CFF4A" stroke-width="4" stroke-linejoin="round" transform="translate(16 14)">
        <path d="M20 0L40 11V33L20 44L0 33V11Z"/>
        <path d="M0 11L20 22L40 11M20 22V44"/>
      </g>
    </g>
  </g>

  <!-- Booking card -->
  <g transform="translate(728 118)">
    <rect x="10" y="12" width="440" height="484" rx="22" fill="#111214"/>
    <rect width="440" height="484" rx="22" fill="#FFFFFF" stroke="#111214" stroke-width="5"/>
    <rect x="32" y="34" width="150" height="16" rx="8" fill="#111214"/>
    <rect x="32" y="62" width="96" height="12" rx="6" fill="#5A5F6B"/>
    <g transform="translate(352 30)" fill="none" stroke="#111214" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect width="56" height="52" rx="10"/>
      <path d="M0 18H56M16 -6V8M40 -6V8"/>
    </g>

    <!-- Calendar -->
    <g transform="translate(32 110)">
      <g fill="#C9CCD3">
        <rect x="14" y="0" width="24" height="10" rx="5"/>
        <rect x="68" y="0" width="24" height="10" rx="5"/>
        <rect x="122" y="0" width="24" height="10" rx="5"/>
        <rect x="176" y="0" width="24" height="10" rx="5"/>
        <rect x="230" y="0" width="24" height="10" rx="5"/>
        <rect x="284" y="0" width="24" height="10" rx="5"/>
        <rect x="338" y="0" width="24" height="10" rx="5"/>
      </g>
      <!-- Selected range: row 2, cols 3-6 -->
      <rect x="108" y="82" width="214" height="44" rx="22" fill="#7B2FF7" opacity=".18"/>
      <g fill="#EEF0F4">
        <rect x="4" y="28" width="44" height="44" rx="12"/>
        <rect x="58" y="28" width="44" height="44" rx="12"/>
        <rect x="112" y="28" width="44" height="44" rx="12"/>
        <rect x="166" y="28" width="44" height="44" rx="12"/>
        <rect x="220" y="28" width="44" height="44" rx="12"/>
        <rect x="274" y="28" width="44" height="44" rx="12"/>
        <rect x="328" y="28" width="44" height="44" rx="12"/>
        <rect x="4" y="82" width="44" height="44" rx="12"/>
        <rect x="58" y="82" width="44" height="44" rx="12"/>
        <rect x="328" y="82" width="44" height="44" rx="12"/>
        <rect x="4" y="136" width="44" height="44" rx="12"/>
        <rect x="58" y="136" width="44" height="44" rx="12"/>
        <rect x="112" y="136" width="44" height="44" rx="12"/>
        <rect x="166" y="136" width="44" height="44" rx="12"/>
        <rect x="220" y="136" width="44" height="44" rx="12"/>
        <rect x="274" y="136" width="44" height="44" rx="12"/>
        <rect x="328" y="136" width="44" height="44" rx="12"/>
        <rect x="4" y="190" width="44" height="44" rx="12"/>
        <rect x="58" y="190" width="44" height="44" rx="12"/>
        <rect x="112" y="190" width="44" height="44" rx="12"/>
        <rect x="166" y="190" width="44" height="44" rx="12"/>
      </g>
      <rect x="112" y="82" width="44" height="44" rx="12" fill="#7B2FF7"/>
      <rect x="274" y="82" width="44" height="44" rx="12" fill="#7B2FF7"/>
    </g>

    <!-- Guests + button -->
    <g transform="translate(32 368)">
      <rect width="170" height="16" rx="8" fill="#EEF0F4"/>
      <rect x="206" width="170" height="16" rx="8" fill="#EEF0F4"/>
    </g>
    <g transform="translate(32 406)">
      <rect width="376" height="52" rx="26" fill="#5CFF4A" stroke="#111214" stroke-width="5"/>
      <rect x="140" y="20" width="96" height="12" rx="6" fill="#111214"/>
    </g>
  </g>

  <!-- Confirmed chip -->
  <g transform="translate(560 96)">
    <rect width="176" height="64" rx="32" fill="#FFC21A" stroke="#111214" stroke-width="5"/>
    <circle cx="34" cy="32" r="16" fill="#111214"/>
    <path d="M26 32l6 6 11-12" fill="none" stroke="#FFC21A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="20" width="90" height="10" rx="5" fill="#111214"/>
    <rect x="62" y="36" width="60" height="10" rx="5" fill="#111214" opacity=".5"/>
  </g>
</svg>
