  </g>

  <!-- Pipeline arrow + warehouse -->
  <g fill="none" stroke="#111214" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 320H392" stroke-dasharray="2 14"/>
    <path d="M500 320H548" stroke-dasharray="2 14"/>
    <path d="M536 306l14 14-14 14"/>
  </g>
  <g transform="translate(404 252)">
    <ellipse cx="48" cy="18" rx="48" ry="18" fill="#FFC21A" stroke="#111214" stroke-width="5"/>
    <path d="M0 18V118c0 10 21.5 18 48 18s48-8 48-18V18" fill="#FFC21A" stroke="#111214" stroke-width="5"/>
    <path d="M0 52c0 10 21.5 18 48 18s48-8 48-18M0 86c0 10 21.5 18 48 18s48-8 48-18" fill="none" stroke="#111214" stroke-width="5"/>
  </g>

  <!-- Dashboard window -->
  <g transform="translate(572 132)">
    <rect x="10" y="12" width="612" height="456" rx="22" fill="#111214"/>
    <rect width="612" height="456" rx="22" fill="#FFFFFF" stroke="#111214" stroke-width="5"/>
    <path d="M2.5 54H609.5" stroke="#111214" stroke-width="5"/>
    <circle cx="32" cy="28" r="8" fill="#E6338A"/>
    <circle cx="58" cy="28" r="8" fill="#FFC21A"/>
