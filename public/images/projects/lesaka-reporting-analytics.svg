    <rect width="168" height="64" rx="32" fill="#FFC21A" stroke="#111214" stroke-width="5"/>
    <path d="M44 14c3 13 7 17 18 18-11 1-15 5-18 18-3-13-7-17-18-18 11-1 15-5 18-18Z" fill="#111214"/>
    <rect x="76" y="20" width="68" height="10" rx="5" fill="#111214"/>
    <rect x="76" y="36" width="48" height="10" rx="5" fill="#111214" opacity=".5"/>
