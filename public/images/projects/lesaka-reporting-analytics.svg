<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Illustration of spreadsheets flowing into an analytics dashboard">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E1E4EA" stroke-width="2"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#F2F3F7"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Source spreadsheets -->
  <g transform="translate(96 196)">
    <g transform="translate(24 -24)" opacity=".55">
      <rect width="200" height="248" rx="16" fill="#FFFFFF" stroke="#111214" stroke-width="4"/>
    </g>
    <g transform="translate(12 -12)" opacity=".8">
      <rect width="200" height="248" rx="16" fill="#FFFFFF" stroke="#111214" stroke-width="4"/>
    </g>
    <rect width="200" height="248" rx="16" fill="#FFFFFF" stroke="#111214" stroke-width="4"/>
    <rect x="2" y="2" width="196" height="40" rx="14" fill="#5CFF4A"/>
    <path d="M2 42H198" stroke="#111214" stroke-width="4"/>
    <g stroke="#E1E4EA" stroke-width="3">
      <path d="M2 82H198M2 122H198M2 162H198M2 202H198"/>
      <path d="M70 42V246M134 42V246"/>
    </g>
    <g fill="#5A5F6B">
      <rect x="16" y="58" width="40" height="10" rx="5"/>
      <rect x="84" y="58" width="36" height="10" rx="5"/>
      <rect x="148" y="58" width="32" height="10" rx="5"/>
      <rect x="16" y="98" width="34" height="10" rx="5"/>
      <rect x="84" y="98" width="40" height="10" rx="5"/>
      <rect x="148" y="98" width="28" height="10" rx="5"/>
      <rect x="16" y="138" width="40" height="10" rx="5"/>
      <rect x="84" y="138" width="30" height="10" rx="5"/>
      <rect x="148" y="138" width="34" height="10" rx="5"/>
      <rect x="16" y="178" width="28" height="10" rx="5"/>
      <rect x="84" y="178" width="38" height="10" rx="5"/>
      <rect x="148" y="178" width="30" height="10" rx="5"/>
