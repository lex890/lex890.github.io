    <g transform="translate(412 80)">
      <rect width="172" height="88" rx="14" fill="#EEF0F4"/>
      <rect x="18" y="20" width="60" height="10" rx="5" fill="#5A5F6B"/>
      <rect x="18" y="44" width="120" height="24" rx="8" fill="#111214"/>
    </g>

    <!-- Bar chart -->
    <g transform="translate(28 196)">
      <rect width="268" height="232" rx="14" fill="#EEF0F4"/>
      <path d="M24 204H244" stroke="#C9CCD3" stroke-width="3"/>
      <g fill="#7B2FF7">
        <rect x="32" y="128" width="28" height="76" rx="6"/>
        <rect x="76" y="92" width="28" height="112" rx="6"/>
        <rect x="120" y="112" width="28" height="92" rx="6"/>
        <rect x="164" y="60" width="28" height="144" rx="6"/>
      </g>
      <rect x="208" y="32" width="28" height="172" rx="6" fill="#5CFF4A" stroke="#111214" stroke-width="4"/>
